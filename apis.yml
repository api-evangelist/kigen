aid: kigen
name: Kigen
description: 'Kigen is a security-focused eSIM and iSIM technology company, spun out of Arm in 2020 and
  headquartered in Cambridge, UK, backed by SoftBank. Kigen builds GSMA-compliant SIM operating systems,
  integrated SIM (iSIM) and embedded SIM (eSIM) technology, remote SIM provisioning (RSP), and In-Factory
  Profile Provisioning (IFPP), together with lifecycle and over-the-air (OTA) management for connected
  and IoT devices. Its eUICC security, SIM OS, and provisioning platform serve mobile network operators,
  device manufacturers, OEMs and ODMs, IoT service providers, and enterprises building connected products,
  enabling secure cellular connectivity at scale across the device lifecycle. This profile was surfaced
  as a portfolio company of SoftBank Vision Fund and enriched by the API Evangelist pipeline from Kigen''s
  public web surface.'
